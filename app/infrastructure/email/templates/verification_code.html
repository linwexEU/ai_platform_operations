<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Your Account</title>
</head>

<body style="
    margin: 0;
    padding: 0;
    background-color: #fff5f7;
    font-family: Arial, Helvetica, sans-serif;
">

    <div style="
        max-width: 500px;
        margin: 40px auto;
        padding: 40px 30px;
        background-color: #ffffff;
        border-radius: 16px;
        text-align: center;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    ">

        <h1 style="
            margin: 0 0 15px;
            color: #333333;
            font-size: 26px;
        ">
            Verify Your Account
        </h1>

        <p style="
            margin: 0 0 30px;
            color: #777777;
            font-size: 16px;
            line-height: 1.6;
        ">
            Thanks for signing up! Click the button below to verify
            your account.
        </p>

        <a href="{url=verification_url}" style="
            display: inline-block;
            padding: 14px 32px;
            background-color: #e88b9d;
            color: #ffffff;
            text-decoration: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
        ">
            Verify account
        </a>

        <p style="
            margin: 30px 0 0;
            color: #999999;
            font-size: 14px;
            line-height: 1.5;
        ">
            This verification link will expire in <strong>2 minutes</strong>.
        </p>

        <div style="
            margin-top: 35px;
            padding-top: 20px;
            border-top: 1px solid #f3e1e5;
        ">
            <p style="
                margin: 0;
                color: #aaaaaa;
                font-size: 12px;
                line-height: 1.5;
            ">
                If you didn't create an account, you can safely ignore
                this email.
            </p>
        </div>

    </div>

</body>
</html>
